version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      dev:
        patterns: ["*"]
        update-types: [minor, patch]
    # Büyük sürümler (ör. ESLint 10) yapılandırma değişikliği ister; elle yükseltilir
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
